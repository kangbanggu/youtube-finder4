<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SmartTube Finder A단계 (완성)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Noto Sans KR,Arial;background:#f5f7fb;margin:0;padding:16px}
.wrap{max-width:1100px;margin:auto}
h1{text-align:center;color:#e60023}
.box{background:#fff;padding:14px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.06);margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{padding:8px;border-radius:8px;border:1px solid #ccc;font-size:14px}
button{background:#e60023;color:#fff;border:none;cursor:pointer}
.section{margin-top:10px;font-weight:700}
.card{display:grid;grid-template-columns:160px 1fr;gap:10px;padding:10px;border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:10px;cursor:pointer}
.thumb{width:100%;border-radius:8px}
.small{font-size:13px;color:#555}
.badge{display:inline-block;background:#eee;padding:4px 8px;border-radius:20px;font-size:12px;margin-right:6px}
.short{background:#e0f2fe;color:#075985}
.mid{background:#fef9c3;color:#854d0e}
.long{background:#ede9fe;color:#4c1d95}
.buff{background:#dcfce7;color:#046c4e;font-weight:700}
</style>
</head>

<body>
<div class="wrap">
<h1>📊 SmartTube Finder (A단계)</h1>

<div class="box">
<div class="row">
<input id="q" placeholder="검색어" style="flex:1">
<button onclick="search()">검색</button>
</div>
</div>

<div class="box">
<div class="section">📊 밀리기 시작한 영상</div>
<div id="result"></div>
</div>
</div>

<script>
const API_KEY="AIzaSyBMA6UbKczjPJkqExjd4_evvq3nUz-Agi8";

function isoToSec(t){
let h=/(\d+)H/.exec(t)?.[1]||0
let m=/(\d+)M/.exec(t)?.[1]||0
let s=/(\d+)S/.exec(t)?.[1]||0
return h*3600+m*60+s*1
}

async function search(){
result.innerHTML=""
const q=document.getElementById("q").value.trim()
if(!q)return alert("검색어 입력")

const after=new Date(Date.now()-7*86400000).toISOString()

const s=await fetch(
`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=25&q=${q}&publishedAfter=${after}&key=${API_KEY}`
).then(r=>r.json())

const ids=s.items.map(i=>i.id.videoId).join(",")
const v=await fetch(
`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id=${ids}&key=${API_KEY}`
).then(r=>r.json())

v.items.forEach(it=>{
const dur=isoToSec(it.contentDetails.duration)
let type="", cls=""

if(dur<60){ type="쇼츠"; cls="short" }
else if(dur>=240 && dur<600){ type="미드폼"; cls="mid" }
else if(dur>=600){ type="롱폼"; cls="long" }
else return

const views=+it.statistics.viewCount
const key="snap_"+it.id
const prev=localStorage.getItem(key)
let buff=false

if(prev){
const diff=views-prev
if(diff>=prev*0.5) buff=true
}
localStorage.setItem(key,views)

if(!buff) return

result.innerHTML+=`
<div class="card" onclick="window.open('https://www.youtube.com/watch?v=${it.id}','_blank')">
<img class="thumb" src="${it.snippet.thumbnails.medium.url}">
<div>
<span class="badge ${cls}">${type}</span>
<span class="badge buff">🔥 밀리기 시작</span>
<b>${it.snippet.title}</b>
<div class="small">조회수 ${views.toLocaleString()}</div>
</div>
</div>`
})
}
</script>
</body>
</html>
