<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>YouTube 채널 밀림 감지기 E단계</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef1f5;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    /* 검색 영역 */
    .search-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    input {
      padding: 10px;
      width: 280px;
      font-size: 14px;
    }

    button {
      padding: 10px 16px;
      margin-left: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    /* 결과 박스 */
    .result-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .result-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
    }

    /* 영상 카드 */
    .video-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      background: #f9fafc;
      cursor: pointer;
      border-left: 6px solid transparent;
    }

    .video-card:hover {
      background: #e6f0ff;
    }

    .video-title {
      font-size: 14px;
      font-weight: 500;
    }

    /* 배지 */
    .badge {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #fff;
      font-weight: bold;
    }

    .warning {
      background: #ff9800;
    }

    .danger {
      background: #e53935;
    }

    .warning-border {
      border-left-color: #ff9800;
    }

    .danger-border {
      border-left-color: #e53935;
    }

    /* API 안내 */
    .api-info {
      margin-top: 20px;
      font-size: 13px;
      color: #333;
      background: #fff3cd;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<h1>📉 유튜브 채널 밀림 감지기 (E단계)</h1>

<div class="search-box">
  <input id="keyword" placeholder="검색 키워드 입력" />
  <button onclick="run()">검색 실행</button>
</div>

<div id="result"></div>

<div class="api-info">
  🔑 <b>YouTube API KEY 위치</b><br>
  아래 JS 코드의 <b>YOUR_API_KEY</b> 자리에 키 입력하면 실제 데이터 연동 가능
</div>

<script>
/* ===============================
   🔑 YouTube API KEY
   =============================== */
const YOUTUBE_API_KEY = "AIzaSyBMA6UbKczjPJkqExjd4_evvq3nUz-Agi8"; // ← 여기에 입력

/* ===============================
   테스트용 더미 데이터
   =============================== */
const videos = [
  {
    title: "2026년 기초연금 바뀝니다",
    views: [18000, 11000, 6000],
    url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
  },
  {
    title: "노인 일자리 대폭 축소 현실",
    views: [20000, 9000, 4000],
    url: "https://www.youtube.com/watch?v=9bZkp7q19f0"
  }
];

/* ===============================
   밀림 단계 판별 (2단계)
   =============================== */
function detectStage(views) {
  if (views[2] < views[1] && views[1] < views[0]) {
    return 2; // 위험
  }
  return 1; // 주의
}

/* ===============================
   실행
   =============================== */
function run() {
  const container = document.getElementById("result");
  container.innerHTML = "";

  const box = document.createElement("div");
  box.className = "result-box";

  const title = document.createElement("div");
  title.className = "result-title";
  title.innerText = "📊 채널 밀림 감지 결과 (E단계)";
  box.appendChild(title);

  videos.forEach(video => {
    const stage = detectStage(video.views);

    const card = document.createElement("div");
    card.className = "video-card " + (stage === 2 ? "danger-border" : "warning-border");

    card.onclick = () => {
      window.open(video.url, "_blank");
    };

    const name = document.createElement("div");
    name.className = "video-title";
    name.innerText = video.title;

    const badge = document.createElement("div");
    badge.className = "badge " + (stage === 2 ? "danger" : "warning");
    badge.innerText = stage === 2 ? "위험 단계" : "주의 단계";

    card.appendChild(name);
    card.appendChild(badge);
    box.appendChild(card);
  });

  container.appendChild(box);
}
</script>

</body>
</html>
