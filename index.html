<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>YouTube Channel Analyzer Pro</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6fa;
        margin: 0; padding: 0;
    }
    header {
        background: #1e3a8a; color: white;
        padding: 20px; font-size: 24px; text-align:center;
    }

    /* 검색창 */
    .search-box {
        background: white;
        padding: 20px;
        margin: 20px auto;
        width: 90%; max-width: 700px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    .search-box input {
        width: 70%; padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px; font-size: 17px;
    }
    .search-box button {
        padding: 12px 18px;
        border: none; cursor: pointer;
        background: #2563eb; color: white;
        border-radius: 8px; font-size: 17px;
    }

    /* 대시보드 */
    .stats-box {
        width: 90%; margin: 20px auto;
        display: flex; gap: 15px;
    }
    .card {
        flex: 1; padding: 18px; border-radius: 12px;
        color: white; font-size: 18px;
        font-weight: bold;
    }
    .api-card { background: #f59e0b; }
    .snapshot-card { background: #ef4444; }
    .snapshot-card.green { background: #10b981; }

    /* 결과 리스트 */
    .results {
        width: 90%; margin: 20px auto;
    }
    .video-item {
        background: white;
        margin-bottom: 15px;
        padding: 15px;
        border-radius: 12px;
        display: flex; gap: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .video-item img {
        width: 180px; border-radius: 8px;
    }

    .badge {
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 13px;
        display: inline-block;
        margin-right: 6px;
    }
    .shorts { background: #10b981; color: white; }
    .long { background: #3b82f6; color: white; }
    .buff { background: #22c55e; color: white; }

    .pagination {
        display: flex; justify-content:center;
        gap: 10px; margin: 20px;
    }
    .pagination button {
        padding: 10px 15px;
        border-radius: 8px;
        border: none; cursor: pointer;
        background: #2563eb; color: white;
        font-size: 16px;
    }
</style>
</head>
<body>

<header>YouTube Channel Analyzer PRO (New UI)</header>

<!-- 검색 영역 -->
<div class="search-box">
    <input id="keyword" placeholder="채널명 또는 검색어 입력">
    <button onclick="search()">검색</button>
</div>

<!-- 대시보드 -->
<div class="stats-box">
    <div class="card api-card" id="apiUsage">API 사용량: 계산 중...</div>
    <div class="card snapshot-card green" id="snapshotStatus">스냅샷: 정상</div>
</div>

<!-- 결과 -->
<div class="results" id="results"></div>

<!-- 페이지네이션 -->
<div class="pagination" id="pagination"></div>

<script>
// --------------------------
// 1) API KEY 설정
// --------------------------
const API_KEY = "AIzaSyBMA6UbKczjPJkqExjd4_evvq3nUz-Agi8";

// --------------------------
let nextPageToken = "";
let prevPageToken = "";
let currentQuery = "";

// --------------------------
async function search(pageToken="") {
    const keyword = document.getElementById("keyword").value;
    if(!keyword) return;

    currentQuery = keyword;

    const url = `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&part=snippet&type=video&maxResults=10&q=${keyword}&pageToken=${pageToken}`;

    updateApiUsage(10);

    const res = await fetch(url);
    const data = await res.json();
    renderResults(data);
}

// --------------------------
function updateApiUsage(amount) {
    document.getElementById("apiUsage").textContent = `API 사용량: +${amount}`;
}

// --------------------------
async function renderResults(data) {
    const items = data.items;
    nextPageToken = data.nextPageToken || "";
    prevPageToken = data.prevPageToken || "";

    let html = "";

    for(const v of items){
        const title = v.snippet.title;
        const thumbnail = v.snippet.thumbnails.medium.url;
        const videoId = v.id.videoId;

        let badge = "";
        if(title.includes("Shorts") || title.includes("#shorts")){
            badge = `<span class="badge shorts">쇼츠</span>`;
        } else {
            badge = `<span class="badge long">영상</span>`;
        }

        // 랜덤 버프 예시 표시
        const isBuff = Math.random() > 0.7;
        let buffBadge = isBuff ? `<span class="badge buff">버프 의심</span>` : "";

        html += `
            <div class="video-item">
                <img src="${thumbnail}">
                <div>
                    <h3>${title}</h3>
                    ${badge}${buffBadge}
                    <p><a href="https://www.youtube.com/watch?v=${videoId}" target="_blank">영상 보기</a></p>
                </div>
            </div>
        `;
    }

    document.getElementById("results").innerHTML = html;
    renderPagination();
}

// --------------------------
function renderPagination(){
    let html = "";

    if(prevPageToken){
        html += `<button onclick="search('${prevPageToken}')">◀ 이전</button>`;
    }
    if(nextPageToken){
        html += `<button onclick="search('${nextPageToken}')">다음 ▶</button>`;
    }

    document.getElementById("pagination").innerHTML = html;
}

</script>

</body>
</html>
