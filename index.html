<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube Channel Search</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        padding: 20px;
    }
    #container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 { color: #d9534f; }

    .input-group {
        margin-bottom: 15px;
    }

    input[type="text"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    button {
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        margin-right: 5px;
    }

    #searchBtn { background: #f0ad4e; color: white; }
    #snapshotSave { background: #0275d8; color: white; }
    #snapshotLoad { background: #5cb85c; color: white; }
    #clearBtn { background: #d9534f; color: white; }

    .video-item {
        background: #fafafa;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 6px;
        border: 1px solid #eee;
    }
</style>
</head>

<body>
<div id="container">
    <h1>YouTube Channel Search</h1>

    <div class="input-group">
        <label><b>🔑 YouTube API Key</b></label>
        <input type="text" id="apiKeyInput" placeholder="AIzaSyBMA6UbKczjPJkqExjd4_evvq3nUz-Agi8">
        <!-- 🟥 API KEY 저장 위치 표시 -->
        <!-- localStorage에 자동 저장됨 -->
    </div>

    <div class="input-group">
        <label><b>🔍 검색어 입력</b></label>
        <input type="text" id="queryInput" placeholder="예: 기초연금, 노인복지 등">
    </div>

    <button id="searchBtn">검색하기</button>
    <button id="snapshotSave">스냅샷 저장</button>
    <button id="snapshotLoad">스냅샷 불러오기</button>
    <button id="clearBtn">초기화</button>

    <hr />

    <h2>📌 검색 결과</h2>
    <div id="results"></div>
</div>

<script>
// ----------------------------
// 🔐 API KEY 저장 & 불러오기
// ----------------------------
const apiKeyInput = document.getElementById("apiKeyInput");
apiKeyInput.value = localStorage.getItem("YT_API_KEY") || "";

apiKeyInput.addEventListener("input", () => {
    localStorage.setItem("YT_API_KEY", apiKeyInput.value);
});

// ----------------------------
// 🔍 유튜브 API 요청 함수
// ----------------------------
async function searchVideos() {
    const query = document.getElementById("queryInput").value;
    const apiKey = apiKeyInput.value;

    if (!apiKey) return alert("API 키가 없습니다.");
    if (!query) return alert("검색어를 입력하세요.");

    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&q=${encodeURIComponent(query)}&key=${apiKey}`;

    const res = await fetch(url);
    const data = await res.json();

    if (!data.items) {
        alert("검색 실패! API 키 또는 쿼리를 확인하세요.");
        return;
    }

    // 영상 ID만 추출
    let videoIds = data.items.map(v => v.id.videoId).join(",");

    // ➜ 상세 조회
    fetchVideoDetails(videoIds);
}

// ----------------------------
// 📌 상세 조회 + 조회수 비교
// ----------------------------
async function fetchVideoDetails(videoIds) {
    const apiKey = apiKeyInput.value;

    const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id=${videoIds}&key=${apiKey}`;

    const res = await fetch(url);
    const data = await res.json();

    let videos = data.items.map(v => {
        let publishDate = new Date(v.snippet.publishedAt);
        let days = (Date.now() - publishDate) / (1000*60*60*24);
        let dailyGrowth = Math.round(v.statistics.viewCount / days);

        return {
            id: v.id,
            title: v.snippet.title,
            views: Number(v.statistics.viewCount),
            dailyGrowth: dailyGrowth,
            published: v.snippet.publishedAt
        };
    });

    // 조회수 높은순 정렬
    videos.sort((a,b) => b.views - a.views);

    renderResults(videos);
}

// ----------------------------
// 🎨 결과 렌더링
// ----------------------------
function renderResults(videos) {
    const box = document.getElementById("results");
    box.innerHTML = "";

    videos.forEach(v => {
        box.innerHTML += `
            <div class="video-item">
                <b>${v.title}</b><br>
                조회수: ${v.views.toLocaleString()}<br>
                하루 증가량: ${v.dailyGrowth.toLocaleString()}<br>
                업로드: ${v.published}<br>
                <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank">영상 보기</a>
            </div>
        `;
    });
}

// ----------------------------
// 💾 스냅샷 저장
// ----------------------------
document.getElementById("snapshotSave").addEventListener("click", () => {
    localStorage.setItem("YT_SNAPSHOT", document.getElementById("results").innerHTML);
    alert("스냅샷 저장 완료!");
});

// ----------------------------
// 📂 스냅샷 불러오기
// ----------------------------
document.getElementById("snapshotLoad").addEventListener("click", () => {
    const saved = localStorage.getItem("YT_SNAPSHOT");
    if (!saved) return alert("저장된 스냅샷이 없습니다.");

    document.getElementById("results").innerHTML = saved;
});

// ----------------------------
// ❌ 초기화
// ----------------------------
document.getElementById("clearBtn").addEventListener("click", () => {
    localStorage.removeItem("YT_SNAPSHOT");
    document.getElementById("results").innerHTML = "";
    alert("모든 데이터 초기화 완료!");
});

// 🔍 검색 버튼
document.getElementById("searchBtn").addEventListener("click", searchVideos);
</script>

</body>
</html>
