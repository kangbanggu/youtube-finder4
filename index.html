<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>YouTube 채널 밀림 감지기 (E단계)</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .search-box {
      margin-bottom: 20px;
    }

    input {
      padding: 8px;
      width: 300px;
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
    }

    .section {
      background: #fff;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .video {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .video:hover {
      background: #f0f8ff;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      color: white;
      font-size: 12px;
    }

    .level-1 {
      background: orange;
    }

    .level-2 {
      background: red;
    }
  </style>
</head>

<body>

<h1>📉 유튜브 채널 밀림 감지 (E단계)</h1>

<div class="search-box">
  <input id="keyword" placeholder="검색 키워드 입력" />
  <button onclick="search()">검색</button>
</div>

<!-- 결과 영역 -->
<div id="result"></div>

<script>
  // 예시 데이터 (API 붙이기 전 테스트용)
  const videos = [
    {
      title: "기초연금 2026년 변경",
      views: [12000, 8000, 5000],
      url: "https://www.youtube.com/watch?v=VIDEO1"
    },
    {
      title: "노인 일자리 대폭 축소",
      views: [15000, 9000, 3000],
      url: "https://www.youtube.com/watch?v=VIDEO2"
    }
  ];

  function detectLevel(views) {
    if (views[2] < views[1] && views[1] < views[0]) {
      return 2; // 위험
    }
    if (views[2] < views[1]) {
      return 1; // 주의
    }
    return 0;
  }

  function search() {
    const result = document.getElementById("result");
    result.innerHTML = "";

    const section = document.createElement("div");
    section.className = "section";

    const title = document.createElement("div");
    title.className = "section-title";
    title.innerText = "🔍 밀림 감지 결과";
    section.appendChild(title);

    videos.forEach(v => {
      const level = detectLevel(v.views);

      if (level > 0) {
        const row = document.createElement("div");
        row.className = "video";
        row.onclick = () => window.open(v.url, "_blank");

        const name = document.createElement("div");
        name.innerText = v.title;

        const badge = document.createElement("span");
        badge.className = "badge " + (level === 1 ? "level-1" : "level-2");
        badge.innerText = level === 1 ? "주의" : "위험";

        row.appendChild(name);
        row.appendChild(badge);
        section.appendChild(row);
      }
    });

    result.appendChild(section);
  }
</script>

</body>
</html>
