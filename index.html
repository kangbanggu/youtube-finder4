<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>YouTube 성장 감지 트렌드 파인더</title>
<style>
body { font-family: Arial, sans-serif; background:#fafafa; }
header { padding:10px; background:#111; color:#fff; }
input, button { padding:6px; margin:4px; }
.card {
  background:#fff; padding:10px; margin:10px;
  border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
.score { font-weight:bold; color:#e60023; }
.small { color:#666; font-size:13px; }
</style>
</head>
<body>

<header>
  <h2>📈 유튜브 성장 감지 트렌드 파인더</h2>
</header>

<div style="padding:10px;">
  <input id="q" placeholder="검색어 (예: 기초연금, 노인 사연)">
  <button id="searchBtn">검색</button>
  <button id="saveSnap">스냅샷 저장</button>
  <button id="clearSnap">스냅샷 삭제</button>
  <div id="status"></div>
</div>

<div id="results"></div>

<script>
// ================= 설정 =================
const API_KEY = "AIzaSyBMA6UbKczjPJkqExjd4_evvq3nUz-Agi8";
const SNAP_KEY = "YT_TREND_SNAPSHOT";
// ======================================

let currentData = [];

// ---------- 스냅샷 ----------
function saveSnapshot(data){
  localStorage.setItem(SNAP_KEY, JSON.stringify({
    time: Date.now(),
    data
  }));
}
function loadSnapshot(){
  const s = localStorage.getItem(SNAP_KEY);
  return s ? JSON.parse(s) : null;
}
function clearSnapshot(){
  localStorage.removeItem(SNAP_KEY);
  alert("스냅샷 삭제 완료");
}

// ---------- 점수 계산 ----------
function calcScore(video, prev){
  let score = 0;

  // A. 구독자 대비 조회수
  if(video.subs > 0){
    const eff = video.views / video.subs;
    if(eff >= 2) score += 4;
    else if(eff >= 1) score += 2;
  }

  // B. 어제 대비 증가
  if(prev){
    const old = prev.views || 0;
    const delta = video.views - old;
    if(delta > 5000) score += 3;
    else if(delta > 1000) score += 2;
  }

  // C. 최근 업로드 (7일 이내)
  const days = (Date.now() - new Date(video.publishedAt)) / 86400000;
  if(days < 7) score += 1;

  return score;
}

// ---------- 검색 ----------
document.getElementById("searchBtn").onclick = async ()=>{
  const q = document.getElementById("q").value.trim();
  if(!q){ alert("검색어 입력"); return; }

  document.getElementById("status").textContent = "검색 중...";
  document.getElementById("results").innerHTML = "";

  const searchUrl =
    `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&q=${encodeURIComponent(q)}&key=${API_KEY}`;

  const sRes = await fetch(searchUrl);
  const sData = await sRes.json();

  if(sData.error){
    document.getElementById("status").textContent = sData.error.message;
    return;
  }

  const videoIds = sData.items.map(i=>i.id.videoId).join(",");
  const videoUrl =
    `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${videoIds}&key=${API_KEY}`;

  const vRes = await fetch(videoUrl);
  const vData = await vRes.json();

  const prevSnap = loadSnapshot();
  const prevMap = {};
  if(prevSnap){
    prevSnap.data.forEach(v=> prevMap[v.id] = v);
  }

  currentData = vData.items.map(v=>{
    return {
      id: v.id,
      title: v.snippet.title,
      channel: v.snippet.channelTitle,
      views: Number(v.statistics.viewCount||0),
      subs: Number(v.statistics.subscriberCount||0),
      publishedAt: v.snippet.publishedAt
    };
  });

  // 점수 계산
  currentData = currentData.map(v=>{
    const prev = prevMap[v.id];
    v.score = calcScore(v, prev);
    v.delta = prev ? v.views - (prev.views||0) : 0;
    return v;
  });

  // 정렬 (성장 의심도)
  currentData.sort((a,b)=> b.score - a.score);

  render();
  document.getElementById("status").textContent =
    `결과 ${currentData.length}개 (상단일수록 의심 ↑)`;
};

// ---------- 렌더 ----------
function render(){
  const el = document.getElementById("results");
  el.innerHTML = "";
  currentData.forEach(v=>{
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="score">성장 의심 점수: ${v.score}</div>
      <div>${v.title}</div>
      <div class="small">채널: ${v.channel}</div>
      <div class="small">조회수: ${v.views.toLocaleString()}</div>
      <div class="small">어제 대비 증가: ${v.delta.toLocaleString()}</div>
    `;
    el.appendChild(div);
  });
}

// ---------- 버튼 ----------
document.getElementById("saveSnap").onclick = ()=>{
  if(!currentData.length){ alert("저장할 데이터 없음"); return; }
  saveSnapshot(currentData);
  alert("스냅샷 저장 완료 (내일 비교 가능)");
};
document.getElementById("clearSnap").onclick = clearSnapshot;
</script>

</body>
</html>
