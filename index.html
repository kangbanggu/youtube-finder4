<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>YouTube Channel Analyzer</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f5f5f5;
    }

    #container {
        max-width: 900px;
        margin: 0 auto;
    }

    h2 { margin-top: 30px; }

    /* 검색 영역 */
    #searchArea {
        display: flex;
        gap: 10px;
        padding-bottom: 20px;
    }

    input {
        padding: 10px;
        flex: 1;
        font-size: 16px;
    }

    button {
        padding: 10px 20px;
        background: #4caf50;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
        border-radius: 6px;
    }

    /* 영상 카드 */
    .video-card {
        background: white;
        padding: 15px;
        margin-bottom: 12px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .title {
        font-size: 17px;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .views {
        font-size: 15px;
        color: gray;
    }

    .growth {
        color: green;
        font-weight: bold;
        margin-top: 5px;
        font-size: 16px;
    }

    /* 버프 의심 배지 */
    .buff-badge {
        display: inline-block;
        padding: 4px 8px;
        background: #00c853;
        color: white;
        border-radius: 5px;
        font-size: 12px;
        margin-left: 10px;
    }

    /* 페이지 */
    #pagination {
        margin-top: 20px;
        display: flex;
        gap: 10px;
    }

    #usageBox {
        margin-top: 25px;
        padding: 10px;
        background: #ececec;
        border-radius: 8px;
        font-size: 14px;
    }
</style>
</head>
<body>

<div id="container">
    <h1>YouTube Channel Analyzer (Upgrade)</h1>

    <div id="searchArea">
        <input type="text" id="keyword" placeholder="채널명 또는 키워드 입력" />
        <button onclick="search()">검색</button>
    </div>

    <div>
        <label>정렬 기준:</label>
        <select id="sortOption" onchange="renderResults()">
            <option value="none">기본 정렬</option>
            <option value="views">조회수 높은 순</option>
            <option value="growth">조회수 증가량 높은 순</option>
            <option value="latest">최신 영상 순</option>
        </select>
    </div>

    <div id="results"></div>

    <div id="pagination"></div>

    <div id="usageBox">
        🔧 사용량: <span id="usage">0</span>
    </div>
</div>

<script>
/* --------------------------------------------
    🔥 전역 데이터
--------------------------------------------- */
let videoData = [];
let snapshot = {};       // 이전 조회수 스냅샷 저장
let nextPage = null;
let prevPage = null;
let apiCount = 0;

/* --------------------------------------------
    🔥 API 호출
--------------------------------------------- */
async function fetchAPI(url) {
    apiCount++;
    document.getElementById("usage").innerText = apiCount;
    const res = await fetch(url);
    return await res.json();
}

/* --------------------------------------------
    🔥 채널/검색 시작
--------------------------------------------- */
async function search(pageToken = "") {
    const keyword = document.getElementById("keyword").value.trim();
    if (!keyword) return alert("검색어를 입력하세요.");

    let url = `https://www.googleapis.com/youtube/v3/search?key=AIzaSyBMA6UbKczjPJkqExjd4_evvq3nUz-Agi8&part=snippet&type=video&q=${encodeURIComponent(keyword)}&maxResults=10&pageToken=${pageToken}`;

    const data = await fetchAPI(url);

    nextPage = data.nextPageToken || null;
    prevPage = data.prevPageToken || null;

    // 상세 정보 조회 (조회수 등)
    const ids = data.items.map(i => i.id.videoId).join(",");

    if (!ids) {
        document.getElementById("results").innerText = "결과 없음";
        return;
    }

    const videoInfo = await fetchAPI(
        `https://www.googleapis.com/youtube/v3/videos?key=AIzaSyBMA6UbKczjPJkqExjd4_evvq3nUz-Agi8&part=snippet,statistics&id=${ids}`
    );

    videoData = videoInfo.items.map(v => ({
        id: v.id,
        title: v.snippet.title,
        published: v.snippet.publishedAt,
        views: Number(v.statistics.viewCount)
    }));

    renderResults();
    renderPagination();
}

/* --------------------------------------------
    🔥 조회수 증가량 계산
--------------------------------------------- */
function compareSnapshots(video) {
    const oldViews = snapshot[video.id] || video.views;
    const growth = video.views - oldViews;

    // 스냅샷 갱신
    snapshot[video.id] = video.views;

    return growth;
}

/* --------------------------------------------
    🔥 버프 의심 여부
--------------------------------------------- */
function getBuffBadge(growth) {
    if (growth > 5000) {
        return `<span class="buff-badge">🚀 버프 의심</span>`;
    }
    return "";
}

/* --------------------------------------------
    🔥 정렬 적용
--------------------------------------------- */
function applySorting(list) {
    const option = document.getElementById("sortOption").value;

    if (option === "views")
        return list.sort((a, b) => b.views - a.views);

    if (option === "growth")
        return list.sort((a, b) => b.growth - a.growth);

    if (option === "latest")
        return list.sort((a, b) => new Date(b.published) - new Date(a.published));

    return list;
}

/* --------------------------------------------
    🔥 결과 렌더링
--------------------------------------------- */
function renderResults() {
    if (!videoData.length) return;

    let enriched = videoData.map(v => {
        v.growth = compareSnapshots(v);
        return v;
    });

    enriched = applySorting(enriched);

    let html = "";

    enriched.forEach(v => {
        html += `
            <div class="video-card" onclick="window.open('https://youtu.be/${v.id}')">
                <div class="title">${v.title}</div>
                <div class="views">조회수: ${v.views.toLocaleString()}회</div>
                <div class="growth">⬆ +${v.growth.toLocaleString()} 증가 ${getBuffBadge(v.growth)}</div>
                <div class="views">업로드: ${v.published.split("T")[0]}</div>
            </div>
        `;
    });

    document.getElementById("results").innerHTML = html;
}

/* --------------------------------------------
    🔥 페이지네이션
--------------------------------------------- */
function renderPagination() {
    let html = "";

    if (prevPage) {
        html += `<button onclick="search('${prevPage}')">이전</button>`;
    }
    if (nextPage) {
        html += `<button onclick="search('${nextPage}')">다음</button>`;
    }

    document.getElementById("pagination").innerHTML = html;
}
</script>

</body>
</html>
