<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SmartTube Finder (E단계 완성)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Noto Sans KR,Arial;background:#f5f7fb;margin:0;padding:16px}
.wrap{max-width:1100px;margin:auto}
h1{text-align:center;color:#e60023}
.box{background:#fff;padding:14px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.06);margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,button{padding:8px;border-radius:8px;border:1px solid #ccc;font-size:14px}
button{background:#e60023;color:#fff;border:none;cursor:pointer}
.section{margin-top:10px;font-weight:700}
.card{padding:12px;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:10px}
.small{font-size:13px;color:#555}
.badge{display:inline-block;background:#eee;padding:4px 8px;border-radius:20px;font-size:12px;margin-right:6px}
.channelBuff{background:#fee2e2;color:#991b1b;font-weight:800}
a{text-decoration:none;color:inherit}
</style>
</head>

<body>
<div class="wrap">
<h1>📊 SmartTube Finder – 채널 밀림 감지 (E단계)</h1>

<div class="box">
<div class="row">
<input id="q" placeholder="검색어 (예: 시니어 복지, 노인 사연)" style="flex:1">
<button onclick="search()">검색</button>
</div>
</div>

<div class="box">
<div class="section">🚀 유튜브가 밀기 시작한 채널</div>
<div id="result"></div>
</div>
</div>

<script>
const API_KEY = "AIzaSyBMA6UbKczjPJkqExjd4_evvq3nUz-Agi8";

async function search(){
result.innerHTML="";
const q=document.getElementById("q").value.trim();
if(!q) return alert("검색어를 입력하세요");

const after=new Date(Date.now()-30*86400000).toISOString();

const s=await fetch(
`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=25&q=${encodeURIComponent(q)}&publishedAfter=${after}&key=${API_KEY}`
).then(r=>r.json());

if(!s.items) return;

const ids=s.items.map(i=>i.id.videoId).join(",");
if(!ids) return;

const v=await fetch(
`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${ids}&key=${API_KEY}`
).then(r=>r.json());

let channels={};

v.items.forEach(it=>{
const views=Number(it.statistics.viewCount||0);
const snapKey="snap_"+it.id;
const prev=Number(localStorage.getItem(snapKey)||0);
const diff=prev?views-prev:0;
localStorage.setItem(snapKey,views);

const chId=it.snippet.channelId;
if(!channels[chId]){
channels[chId]={name:it.snippet.channelTitle,videos:[]};
}
channels[chId].videos.push({diff,views});
});

/* 🔥 채널 밀림 판단 (1~2개 기준) */
Object.values(channels).forEach(ch=>{
const rising=ch.videos.filter(v=>v.diff>0);
const avgDiff=rising.reduce((a,b)=>a+b.diff,0)/(rising.length||1);

if(rising.length >= 1 && avgDiff > 500){
result.innerHTML+=`
<div class="card">
<span class="badge channelBuff">🚀 채널 밀림 감지</span>
<b>${ch.name}</b>
<div class="small">
상승 영상 ${rising.length}개 · 평균 증가 +${Math.floor(avgDiff).toLocaleString()}
</div>
</div>`;
}
});
}
</script>
</body>
</html>
